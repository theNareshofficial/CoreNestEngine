<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Register - CoreNestEngine</title>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-r from-sky-500 to-indigo-600 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl p-8 sm:p-10 w-full max-w-md fade-in">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">CoreNestEngine</h1>
            <p class="text-gray-500 mt-1">Create a new account</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-4 space-y-2">
              {% for category, message in messages %}
                <div class="p-3 rounded-lg text-sm font-medium flex items-center justify-between
                  {% if category == 'error' or category == 'danger' %}
                    bg-red-100 text-red-700 border border-red-300
                  {% elif category == 'success' %}
                    bg-green-100 text-green-700 border border-green-300
                  {% elif category == 'warning' %}
                    bg-yellow-100 text-yellow-800 border border-yellow-300
                  {% else %}
                    bg-blue-100 text-blue-700 border border-blue-300
                  {% endif %}">
                  <span>{{ message }}</span>
                  <button onclick="this.parentElement.remove()" class="text-gray-500 hover:text-gray-800 font-bold ml-2">&times;</button>
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <input type="text" name="username" placeholder="Choose a username" required autofocus
                       class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Phone Number</label>
                <input type="text" name="number" placeholder="e.g. 9876543210" required 
                       class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" name="password" placeholder="Create password" required 
                       class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm password" required 
                       class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-transform transform hover:scale-102 shadow-lg">
                Register
            </button>
        </form>

        <p class="text-center mt-6 text-sm text-gray-600">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="text-indigo-600 font-semibold hover:underline">Login</a>
        </p>
    </div>

    <script>
        function SimpleSuccess() {
            Swal.fire({
                position: "top-end",
                icon: "success",
                title: "Your work has been Registered",
                showConfirmButton: false,
                timer: 1500
            });
        }
    </script>
</body>
</html>
