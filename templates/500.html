<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>500 - Internal Server Error</title>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        @keyframes slide-fade {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .fade-in {
            animation: slide-fade 1s ease-in-out;
        }
    </style>
</head>

<body class="bg-gradient-to-r from-red-500 to-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="text-center bg-white shadow-2xl rounded-3xl p-12 max-w-2xl w-full fade-in">
        <h1 class="text-8xl font-extrabold text-red-600 mb-4">500</h1>
        <h2 class="text-3xl font-semibold text-gray-800 mb-3">Internal Server Error</h2>
        <p class="text-lg text-gray-500 mb-6">Something unexpected occurred on the server. Please try again or return to the home page.</p>

        <a href="{{ url_for('core.home') }}" 
           class="inline-block bg-red-500 text-white px-8 py-3 rounded-xl hover:bg-red-600 transition-all duration-300 transform hover:scale-105 shadow-lg">
           🔙 Return to Home
        </a>
    </div>

</body>
</html>
