<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Login - CoreNestEngine</title>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .slide-in {
            animation: slideIn 0.8s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-to-r from-sky-500 to-indigo-600 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl p-8 sm:p-10 w-full max-w-md slide-in">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">CoreNestEngine</h1>
            <p class="text-gray-500 mt-1">Sign in to your account</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-4 space-y-2">
              {% for category, message in messages %}
                <div class="p-3 rounded-lg text-sm font-medium flex items-center justify-between
                  {% if category == 'error' or category == 'danger' %}
                    bg-red-100 text-red-700 border border-red-300
                  {% elif category == 'success' %}
                    bg-green-100 text-green-700 border border-green-300
                  {% elif category == 'warning' %}
                    bg-yellow-100 text-yellow-800 border border-yellow-300
                  {% else %}
                    bg-blue-100 text-blue-700 border border-blue-300
                  {% endif %}">
                  <span>{{ message }}</span>
                  <button onclick="this.parentElement.remove()" class="text-gray-500 hover:text-gray-800 font-bold ml-2">&times;</button>
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <input type="text" name="username" placeholder="Enter username" required autofocus
                       class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" name="password" placeholder="Enter password" required 
                       class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-transform transform hover:scale-102 shadow-lg">
                Login
            </button>
        </form>

        <p class="text-center mt-6 text-sm text-gray-600">
            Don't have an account? 
            <a href="{{ url_for('auth.register') }}" class="text-indigo-600 font-semibold hover:underline">Register</a>
        </p>

        <div class="mt-6 pt-4 border-t border-gray-100 text-center text-xs text-gray-400">
            Default credentials: <span class="font-mono text-gray-600">admin</span> / <span class="font-mono text-gray-600">admin123</span>
        </div>
    </div>

</body>
</html>
